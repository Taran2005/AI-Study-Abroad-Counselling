[project]
name = "luna-agent"
version = "0.1.0"
description = "Luna AI Voice Agent with Anam Avatar"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai,silero,turn-detector,anam]~=1.4",
    "livekit-plugins-cartesia>=1.5.1",
    "livekit-plugins-deepgram>=1.5.1",
    "livekit-plugins-elevenlabs>=1.5.1",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
