[project]
name = "studybuddyai-agent"
version = "0.1.0"
description = "StudyBuddyAI AI Voice Agent with Anam Avatar & RAG"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai,silero,turn-detector,anam]~=1.4",
    "livekit-plugins-cartesia>=1.5.1",
    "livekit-plugins-deepgram>=1.5.1",
    "livekit-plugins-elevenlabs>=1.5.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "twilio>=9.0.0",
    "livekit-plugins-google>=1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
